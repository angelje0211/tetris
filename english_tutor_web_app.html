<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Conversation Tutor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar: Topic Generator & Settings -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col justify-between p-4 shadow-sm z-10">
        <div>
            <!-- Header Logo -->
            <div class="flex items-center gap-3 pb-4 border-b border-slate-100 mb-4">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
                    <i class="fa-solid font-bold fa-language"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg">Friendly Tutor</h1>
                    <p class="text-xs text-slate-500">AI 영어 회화 파트너</p>
                </div>
            </div>

            <!-- Level Selector -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">영어 난이도 설정</label>
                <select id="levelSelect" class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="beginner" selected>초급 (Easy words & short sentences)</option>
                    <option value="intermediate">중급 (Natural & varied expressions)</option>
                    <option value="advanced">상급 (Advanced vocabulary & complex ideas)</option>
                </select>
            </div>

            <!-- Topic Suggestions -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">오늘의 추천 대화 주제</label>
                <div class="flex flex-col gap-2">
                    <button onclick="selectTopic('How was your day today?')" class="topic-btn text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700 text-xs transition flex items-center gap-2">
                        <i class="fa-regular fa-sun text-amber-500"></i> 오늘 일정 & 하루 일과
                    </button>
                    <button onclick="selectTopic('How are you feeling right now and why?')" class="topic-btn text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700 text-xs transition flex items-center gap-2">
                        <i class="fa-regular fa-smile text-emerald-500"></i> 현재 기분 & 컨디션
                    </button>
                    <button onclick="selectTopic('Did you read or watch any interesting news recently?')" class="topic-btn text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700 text-xs transition flex items-center gap-2">
                        <i class="fa-regular fa-newspaper text-blue-500"></i> 소소한 이슈 & 뉴스
                    </button>
                    <button onclick="selectTopic('What is your favorite food or drink?')" class="topic-btn text-left p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700 text-xs transition flex items-center gap-2">
                        <i class="fa-solid fa-utensils text-rose-500"></i> 좋아하는 음식 & 카페
                    </button>
                </div>
            </div>
        </div>

        <!-- Tutor Prompt Info -->
        <div class="p-3 bg-indigo-50 rounded-xl text-xs text-indigo-900 border border-indigo-100 flex items-start gap-2">
            <i class="fa-solid fa-circle-info text-indigo-500 mt-0.5"></i>
            <p>튜터가 친절하게 질문을 던지며, 문법 오류가 있을 시 다정하게 피드백 해줍니다.</p>
        </div>
    </aside>

    <!-- Main Conversation Panel -->
    <main class="flex-1 flex flex-col h-full bg-slate-100 relative">
        <!-- Chat Header -->
        <header class="bg-white px-6 py-4 border-b border-slate-200 flex items-center justify-between shadow-xs">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <span class="w-3 h-3 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
                </div>
                <div>
                    <h2 class="font-bold text-slate-800">English Tutor Gemini</h2>
                    <p class="text-xs text-slate-500">Always ready to chat & correct your English</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="startVoiceCall()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-phone"></i>
                    <span>음성 통화 시작</span>
                </button>
                <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 대화 초기화
                </button>
            </div>
        </header>

        <!-- Message List Container -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-6 chat-scroll space-y-4">
            <!-- Dynamic Messages inserted here -->
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t border-slate-200 p-4">
            <form id="chatForm" class="flex gap-2 max-w-4xl mx-auto">
                <input type="text" id="userInput" placeholder="영어로 메시지를 입력해 보세요..." required
                    class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <button type="submit" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-3 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 min-w-[80px]">
                    <span>전송</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Voice Call Modal Overlay -->
    <div id="callOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 hidden flex-col items-center justify-between p-8 text-white transition-opacity duration-300">
        <!-- Call Header -->
        <div class="text-center mt-6">
            <span id="callStatusBadge" class="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-xs font-medium mb-2 border border-emerald-500/30">
                <i class="fa-solid fa-circle text-[8px] animate-ping mr-1"></i> 통화 연결 중...
            </span>
            <h2 class="text-2xl font-bold">AI Tutor Gemini</h2>
            <p id="callTimer" class="text-xs text-slate-400 mt-1 font-mono">00:00</p>
        </div>

        <!-- Call Avatar & Visualizer -->
        <div class="flex flex-col items-center my-auto w-full max-w-md">
            <div id="avatarPulse" class="relative flex items-center justify-center w-36 h-36 rounded-full bg-indigo-600/30 transition-all duration-500">
                <div class="w-28 h-28 rounded-full bg-indigo-600 flex items-center justify-center text-4xl shadow-xl">
                    <i class="fa-solid fa-robot"></i>
                </div>
            </div>
            <!-- Live Transcription / Subtitle -->
            <p id="callSubtitle" class="text-sm text-slate-200 mt-8 text-center w-full px-4 min-h-[3.5rem] flex items-center justify-center italic bg-slate-800/80 rounded-2xl p-4 border border-slate-700 shadow-inner">
                "Hello! Press start or speak to begin..."
            </p>
        </div>

        <!-- Call Controls -->
        <div class="flex items-center gap-6 mb-8">
            <button id="toggleMicBtn" onclick="toggleMic()" class="w-14 h-14 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xl text-white hover:bg-slate-700 transition shadow-lg">
                <i id="micIcon" class="fa-solid fa-microphone"></i>
            </button>
            <button onclick="endVoiceCall()" class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-2xl text-white hover:bg-rose-700 transition shadow-xl transform active:scale-95">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <!-- App Logic & API Integration -->
    <script>
        const apiKey = ""; // Canvas Runtime Injection
        let chatHistory = [];
        let currentLevel = 'beginner';

        // Voice Call Variables
        let isCallActive = false;
        let isMicMuted = false;
        let recognition = null;
        let callTimerInterval = null;
        let callSeconds = 0;

        document.getElementById('levelSelect').addEventListener('change', (e) => {
            currentLevel = e.target.value;
        });

        // Initialize Speech Recognition if supported
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;

            const rec = new SpeechRecognition();
            rec.lang = 'en-US';
            rec.continuous = false;
            rec.interimResults = false;

            rec.onstart = () => {
                if (!isCallActive) return;
                updateCallStatus('듣는 중... (Listening)', 'emerald');
                document.getElementById('avatarPulse').classList.add('animate-pulse', 'ring-4', 'ring-emerald-500/50');
            };

            rec.onresult = async (event) => {
                if (!isCallActive) return;
                const spokenText = event.results[0][0].transcript;
                document.getElementById('callSubtitle').innerText = `"${spokenText}"`;

                // Render in main chat too
                addMessage('user', spokenText);
                chatHistory.push({ role: "user", parts: [{ text: spokenText }] });

                updateCallStatus('생각하는 중... (Thinking)', 'indigo');
                document.getElementById('avatarPulse').classList.remove('animate-pulse', 'ring-4', 'ring-emerald-500/50');

                try {
                    const responseText = await fetchGeminiResponse();
                    addMessage('tutor', responseText);
                    chatHistory.push({ role: "model", parts: [{ text: responseText }] });

                    // Clean text for speech
                    const cleanText = responseText.replace(/💡[\s\S]*$/, '').trim();
                    document.getElementById('callSubtitle').innerText = `"${cleanText}"`;

                    speakCallText(cleanText, () => {
                        if (isCallActive && !isMicMuted) {
                            try { rec.start(); } catch(e) {}
                        }
                    });
                } catch (err) {
                    updateCallStatus('오류 발생, 다시 시도 중...', 'rose');
                    setTimeout(() => { if (isCallActive) rec.start(); }, 2000);
                }
            };

            rec.onerror = (event) => {
                console.log('Speech recognition error:', event.error);
                if (isCallActive && !isMicMuted && event.error !== 'no-speech') {
                    setTimeout(() => { try { rec.start(); } catch(e){} }, 1000);
                } else if (isCallActive && !isMicMuted && event.error === 'no-speech') {
                    // Restart listening if silent
                    setTimeout(() => { try { rec.start(); } catch(e){} }, 500);
                }
            };

            return rec;
        }

        // Voice Call Handler Functions
        function startVoiceCall() {
            if (!('speechSynthesis' in window)) {
                alert("현재 브라우저는 음성 재생을 지원하지 않습니다.");
                return;
            }

            recognition = initSpeechRecognition();
            if (!recognition) {
                alert("현재 브라우저는 마이크 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저 사용을 권장합니다.");
                return;
            }

            isCallActive = true;
            isMicMuted = false;
            callSeconds = 0;

            // UI Show Overlay
            const overlay = document.getElementById('callOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            // Start Timer
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                document.getElementById('callTimer').innerText = `${mins}:${secs}`;
            }, 1000);

            // Initial AI Phone Greeting
            const welcomeMsg = "Hello! I am connected now. How is your day going?";
            document.getElementById('callSubtitle').innerText = `"${welcomeMsg}"`;
            updateCallStatus('튜터 말하는 중... (Speaking)', 'indigo');

            speakCallText(welcomeMsg, () => {
                if (isCallActive && !isMicMuted) {
                    try { recognition.start(); } catch(e) {}
                }
            });
        }

        function endVoiceCall() {
            isCallActive = false;
            clearInterval(callTimerInterval);

            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            const overlay = document.getElementById('callOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function toggleMic() {
            isMicMuted = !isMicMuted;
            const btn = document.getElementById('toggleMicBtn');
            const icon = document.getElementById('micIcon');

            if (isMicMuted) {
                btn.classList.add('bg-rose-600', 'border-rose-500');
                btn.classList.remove('bg-slate-800');
                icon.className = 'fa-solid fa-microphone-slash';
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
                updateCallStatus('마이크 음소거됨 (Muted)', 'amber');
            } else {
                btn.classList.remove('bg-rose-600', 'border-rose-500');
                btn.classList.add('bg-slate-800');
                icon.className = 'fa-solid fa-microphone';
                if (recognition && isCallActive) {
                    try { recognition.start(); } catch(e) {}
                }
            }
        }

        function updateCallStatus(text, color) {
            const badge = document.getElementById('callStatusBadge');
            badge.innerText = text;
            badge.className = `inline-block px-3 py-1 bg-${color}-500/20 text-${color}-400 rounded-full text-xs font-medium mb-2 border border-${color}-500/30`;
        }

        function speakCallText(text, onEndCallback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;

                utterance.onstart = () => {
                    updateCallStatus('튜터 말하는 중... (Speaking)', 'indigo');
                };

                utterance.onend = () => {
                    if (onEndCallback) onEndCallback();
                };

                utterance.onerror = () => {
                    if (onEndCallback) onEndCallback();
                };

                window.speechSynthesis.speak(utterance);
            } else {
                if (onEndCallback) onEndCallback();
            }
        }

        // Initialize Chat
        window.onload = function() {
            sendInitialGreeting();
        };

        function sendInitialGreeting() {
            const initialGreeting = "Hi there! I'm so happy to be your English tutor! 😊 How are you feeling today, and what are your plans for the rest of the day?";
            addMessage('tutor', initialGreeting);
            chatHistory.push({ role: "model", parts: [{ text: initialGreeting }] });
        }

        // Handle user input submit
        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputEl = document.getElementById('userInput');
            const userMsg = inputEl.value.trim();
            if (!userMsg) return;

            inputEl.value = '';
            addMessage('user', userMsg);

            // Add user message to history
            chatHistory.push({ role: "user", parts: [{ text: userMsg }] });

            // Show loading state
            const loadingId = addLoadingIndicator();

            try {
                const responseText = await fetchGeminiResponse();
                removeLoadingIndicator(loadingId);
                addMessage('tutor', responseText);
                chatHistory.push({ role: "model", parts: [{ text: responseText }] });
            } catch (error) {
                removeLoadingIndicator(loadingId);
                addMessage('tutor', "Oops! I couldn't process that. Please try again. 😅");
            }
        });

        // Gemini API Fetch Logic with Backoff
        async function fetchGeminiResponse() {
            const systemPrompt = `You are a friendly, encouraging, and patient English conversation tutor. 
Your goal is to converse naturally with the user while adapting to their English level: ${currentLevel}.

Rules:
1. Speak in English naturally and keep your responses simple and easy to understand based on the level (${currentLevel}).
2. ALWAYS review the user's latest input for grammar, vocabulary, or expression errors.
3. If the user made any natural or grammatical errors, include a friendly correction section at the beginning or end of your message in Korean or friendly English format. For example:
   "💡 **Tip**: 'I go store' -> 'I am going to the store'"
4. Always ask one simple follow-up question to keep the conversation going smoothly.
5. Topics can range from daily news, daily schedules, feelings, foods, or hobbies.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            // Exponential Backoff Retries
            let delay = 1000;
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't create a response.";
                    }
                } catch (err) {
                    // Fail silently and retry
                }
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
            throw new Error("Failed after 5 attempts");
        }

        // Render UI Messages
        function addMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            if (sender === 'user') {
                msgWrapper.innerHTML = `
                    <div class="bg-indigo-600 text-white max-w-[80%] rounded-2xl rounded-tr-none px-4 py-3 shadow-xs text-sm">
                        <p class="whitespace-pre-wrap">${escapeHtml(text)}</p>
                    </div>
                `;
            } else {
                // Formatting tutor output (separating correction vs chat if present)
                const formattedText = formatTutorText(text);
                const msgId = 'msg-' + Date.now();

                msgWrapper.innerHTML = `
                    <div class="flex gap-3 max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0 mt-1">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none p-4 shadow-xs text-sm space-y-2">
                            <div class="prose prose-sm">${formattedText}</div>
                            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                                <span>English Tutor</span>
                                <button onclick="speakText('${msgId}')" class="text-indigo-500 hover:text-indigo-700 flex items-center gap-1">
                                    <i class="fa-solid fa-volume-high"></i> 발음 듣기
                                </button>
                            </div>
                            <div id="${msgId}" class="hidden">${escapeHtml(text)}</div>
                        </div>
                    </div>
                `;
            }

            chatBox.appendChild(msgWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function formatTutorText(text) {
            // Converts linebreaks and highlights markdown-like tip/corrections
            let formatted = escapeHtml(text)
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/💡(.*?)<br>/g, '<div class="bg-amber-50 border-l-4 border-amber-400 p-2 my-2 rounded text-amber-900 text-xs">💡 $1</div>');
            return formatted;
        }

        function addLoadingIndicator() {
            const chatBox = document.getElementById('chatBox');
            const loadingId = 'loading-' + Date.now();
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = loadingId;
            loadingWrapper.className = 'flex justify-start';
            loadingWrapper.innerHTML = `
                <div class="flex gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-white border border-slate-200 text-slate-500 rounded-2xl rounded-tl-none px-4 py-3 shadow-xs text-xs flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i>
                        <span>튜터가 답변을 작성하는 중...</span>
                    </div>
                </div>
            `;
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return loadingId;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Web Speech API for TTS
        async function speakText(elementId) {
            const rawText = document.getElementById(elementId).innerText;
            // Clean text for TTS (remove Korean tips if any)
            const englishOnly = rawText.replace(/💡[\s\S]*$/, ''); 

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop active speech
                const utterance = new SpeechSynthesisUtterance(englishOnly);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // Slightly slower for language learners
                window.speechSynthesis.speak(utterance);
            } else {
                alert("이 브라우저는 음성 합성을 지원하지 않습니다.");
            }
        }

        function selectTopic(promptText) {
            document.getElementById('userInput').value = promptText;
            document.getElementById('chatForm').dispatchEvent(new Event('submit'));
        }

        function clearChat() {
            chatHistory = [];
            document.getElementById('chatBox').innerHTML = '';
            sendInitialGreeting();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
